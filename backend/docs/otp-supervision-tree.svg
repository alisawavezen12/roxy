<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#666"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #333; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 15px; }
      .small { font-size: 13px; }
      .box { stroke-width: 2; rx: 12; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1500" height="980" fill="#fff"/>
  <text x="750" y="36" text-anchor="middle" class="title">Roxy OTP supervision tree</text>

  <rect x="610" y="65" width="280" height="70" class="box" fill="#f5f5f5" stroke="#666"/>
  <text x="750" y="94" text-anchor="middle" class="label">BEAM / main</text>
  <text x="750" y="116" text-anchor="middle" class="small">backend.gleam</text>

  <rect x="540" y="175" width="420" height="80" class="box" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="750" y="207" text-anchor="middle" class="label">roxy_application.start</text>
  <text x="750" y="230" text-anchor="middle" class="small">load config · build Dependencies once</text>

  <rect x="120" y="300" width="1260" height="530" rx="18" fill="#f3e8f5" stroke="#9673a6" stroke-width="3"/>
  <rect x="120" y="300" width="1260" height="44" rx="18" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="150" y="329" class="label" font-weight="700">Roxy root supervisor · RestForOne · restart tolerance: 3 restarts / 10 seconds</text>

  <rect x="190" y="390" width="360" height="80" class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="370" y="421" text-anchor="middle" class="label">PostgreSQL pool child</text>
  <text x="370" y="445" text-anchor="middle" class="small">pog.supervised(pool_config)</text>

  <rect x="230" y="525" width="280" height="90" class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="370" y="558" text-anchor="middle" class="label">PostgreSQL pool supervisor</text>
  <text x="370" y="582" text-anchor="middle" class="small">pgo connections 1..N</text>

  <rect x="700" y="390" width="410" height="80" class="box" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="905" y="421" text-anchor="middle" class="label">HTTP / Mist child</text>
  <text x="905" y="445" text-anchor="middle" class="small">mist.supervised(builder)</text>

  <rect x="750" y="525" width="310" height="80" class="box" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="905" y="558" text-anchor="middle" class="label">Mist internal supervisor</text>
  <text x="905" y="582" text-anchor="middle" class="small">listener · factory · workers</text>

  <rect x="750" y="660" width="310" height="70" class="box" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="905" y="691" text-anchor="middle" class="label">Wisp handler</text>
  <text x="905" y="713" text-anchor="middle" class="small">router → handlers</text>

  <rect x="1130" y="180" width="300" height="100" class="box" fill="#fff2cc" stroke="#d6b656"/>
  <text x="1280" y="216" text-anchor="middle" class="label">Dependencies</text>
  <text x="1280" y="239" text-anchor="middle" class="small">AppConfig + named pog.Connection</text>
  <text x="1280" y="260" text-anchor="middle" class="small">captured by handler closure</text>

  <rect x="390" y="875" width="720" height="70" class="box" fill="#f8cecc" stroke="#b85450"/>
  <text x="750" y="904" text-anchor="middle" class="label">Verified: failed child restarts under supervisor</text>
  <text x="750" y="927" text-anchor="middle" class="small">Shutdown order: Mist first, then PostgreSQL</text>

  <path d="M750 135 L750 175" class="arrow"/>
  <path d="M750 255 L750 300" class="arrow"/>
  <path d="M350 344 L350 390" class="arrow"/>
  <path d="M1040 344 L905 390" class="arrow"/>
  <path d="M370 470 L370 525" class="arrow"/>
  <path d="M905 470 L905 525" class="arrow"/>
  <path d="M905 605 L905 660" class="arrow"/>
  <path d="M1130 230 L1110 430" class="arrow dashed"/>
  <path d="M750 830 L750 875" class="arrow dashed"/>

  <text x="270" y="375" class="small">first child</text>
  <text x="1010" y="375" class="small">second child</text>
</svg>
