services:
  frontend:
    image: roxy-frontend-prod
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        API_ORIGIN: ${API_ORIGIN:?API_ORIGIN must be set for production frontend}
    init: true
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s
