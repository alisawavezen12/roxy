services:
  backend:
    image: roxy-backend-prod
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      APP_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - database_internal
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 10s
    networks:
      - database_internal

  minio:
    profiles: ["local-infra"]

  minio-init:
    profiles: ["local-infra"]

networks:
  database_internal:
    internal: true

volumes:
  postgres_data:
