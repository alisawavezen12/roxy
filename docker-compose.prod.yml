services:
  backend:
    image: roxy-backend-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    init: true
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 10s
    networks:
      - production_internal

  frontend:
    image: roxy-frontend-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    init: true
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s
    networks:
      - production_internal

  postgres:
    profiles: ["local-infra"]

  minio:
    profiles: ["local-infra"]

  minio-init:
    profiles: ["local-infra"]

networks:
  production_internal:
    internal: true
