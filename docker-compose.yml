name: roxy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: roxy
      POSTGRES_PASSWORD: roxy
      POSTGRES_DB: roxy
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roxy -d roxy"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 10s

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: roxy
      MINIO_ROOT_PASSWORD: roxy-dev-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20
    stop_grace_period: 10s

  minio-init:
    profiles: ["setup"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 roxy roxy-dev-minio
        mc mb --ignore-existing local/roxy

volumes:
  postgres_data:
  minio_data:
